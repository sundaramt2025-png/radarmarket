<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer subtle ring -->
  <circle cx="256" cy="256" r="215" fill="none" stroke="#34d399" stroke-width="4" opacity="0.25"/>
  <circle cx="256" cy="256" r="185" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="6 8" opacity="0.3"/>

  <!-- Target / Goal concentric circles (Slide 1 & 9 homage) -->
  <circle cx="256" cy="256" r="145" fill="#065f46" opacity="0.5"/>
  <circle cx="256" cy="256" r="105" fill="#047857" opacity="0.7"/>

  <!-- Growth Bar Chart representation -->
  <rect x="135" y="310" width="40" height="70" rx="10" fill="#34d399" opacity="0.85"/>
  <rect x="195" y="260" width="40" height="120" rx="10" fill="#10b981" opacity="0.95"/>
  <rect x="255" y="210" width="40" height="170" rx="10" fill="url(#emeraldGrad)"/>
  <rect x="315" y="160" width="40" height="220" rx="10" fill="url(#goldGrad)" filter="url(#glow)"/>

  <!-- Rupee Symbol Badge in Center-Top -->
  <circle cx="380" cy="140" r="50" fill="url(#goldGrad)" filter="url(#glow)"/>
  <text x="380" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="54" font-weight="900" fill="#1e293b" text-anchor="middle">₹</text>

  <!-- Target Bullseye Icon Top-Left -->
  <circle cx="130" cy="130" r="34" fill="#dc2626" opacity="0.9"/>
  <circle cx="130" cy="130" r="22" fill="#ffffff"/>
  <circle cx="130" cy="130" r="10" fill="#dc2626"/>

  <!-- App Title Banner Text -->
  <text x="256" y="445" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" fill="#f8fafc" letter-spacing="2" text-anchor="middle">SMART BUDGET</text>
  <text x="256" y="475" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#6ee7b7" letter-spacing="4" text-anchor="middle">&amp; SAVING MANAGER</text>
</svg>